[project]
name = "tradefarm"
version = "0.5.0"
description = "100-agent AI trading platform for US stocks/ETFs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "alpaca-py>=0.33",
    # Upper bounds added in round 4 ship-readiness audit: protect
    # the project from silent major-version drift on `uv lock --upgrade`.
    "anthropic>=0.40,<1",
    # NOTE (round-4 audit): pandas is intentionally LOOSE for now —
    # the venv is on 3.0.2 (from a prior `uv lock --upgrade`) which
    # introduces CoW-default + removed APIs. Adding `<3.0` would
    # force a downgrade we haven't tested. Action item: explicitly
    # adopt 3.x with audit, OR rebuild the venv with `<3.0`.
    "pandas>=2.2",
    "pyarrow>=17.0",
    "numpy>=2.0",
    "pandas-market-calendars>=4.4,<6",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "websockets>=13.1",
]

[project.optional-dependencies]
ml = [
    "torch>=2.5,<3",
    "scikit-learn>=1.5",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.11",
    "pillow>=12.2.0",
]
vod = [
    # Headless renderer (Session 4) drives the stream UI via Chromium.
    # After `uv sync --extra vod` run `uv run playwright install chromium`.
    # Downstream stages (stitcher / mixer / thumbnail) shell out to system
    # `ffmpeg` — see docs/vod-build-roadmap.md.
    "playwright>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradefarm"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
# Pragmatic, non-strict baseline — a foundation gate, not a strict cleanup.
# The bar is `mypy src/tradefarm` exits 0 on the current tree so CI can
# enforce it going forward. Tighten incrementally (e.g. flip on
# disallow_untyped_defs per-module) as the codebase gains coverage.
files = ["src/tradefarm"]
python_version = "3.12"
# Third-party libs (alpaca-py, torch, anthropic, pandas, …) ship partial or
# no stubs; don't fail on their missing imports.
ignore_missing_imports = true
# Don't descend into the venv / site-packages.
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
warn_redundant_casts = true

# Per-module scope-outs: these modules wrestle with loosely-typed third-party
# SDK return values (alpaca-py's `Order | dict` / `TradeAccount | dict`
# unions, the anthropic SDK's 12-member content-block union, torch's
# untyped `Dataset`). The runtime code is correct; the friction is purely
# at the stub boundary. Scoped out rather than littering call sites with
# casts; revisit if upstream stubs improve.
[[tool.mypy.overrides]]
module = [
    "tradefarm.execution.alpaca_broker",
    "tradefarm.agents.llm_providers",
    "tradefarm.agents.lstm_train",
    "tradefarm.orchestrator.commentary_loop",
]
disable_error_code = ["union-attr", "arg-type", "attr-defined"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
