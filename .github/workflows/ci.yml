name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python — lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync deps (locked, with ml + dev extras)
        run: uv sync --locked --extra ml --extra dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Pytest
        # Tests are deterministic (no network, no real LLM); env-gated
        # integration paths skip-by-default.
        run: uv run pytest -q

  web:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            stream/package-lock.json

      - name: Install (dashboard)
        run: npm ci
        working-directory: web

      - name: Typecheck + build (dashboard)
        run: npm run build
        working-directory: web

      - name: Install (stream)
        run: npm ci
        working-directory: stream

      - name: Typecheck + build (stream)
        run: npm run build
        working-directory: stream
