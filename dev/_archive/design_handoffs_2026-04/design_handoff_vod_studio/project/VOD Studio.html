<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>VOD Studio · tradefarm</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #0b0b0e; color: #fafafa; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; height: 100%; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2e38; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a3e48; }

  @keyframes pulse-dot {
    0%,100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(0.5); opacity: 0.4; }
  }
  .pulse-dot { animation: pulse-dot 1.2s ease-in-out infinite; }

  @keyframes cursor-blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  .cursor-blink { animation: cursor-blink 1s step-end infinite; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="vod-data.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="vod-pipeline.jsx"></script>
<script type="text/babel" src="vod-beats-preview.jsx"></script>
<script type="text/babel" src="vod-beats.jsx"></script>
<script type="text/babel" src="vod-episode.jsx"></script>
<script type="text/babel" src="vod-session.jsx"></script>

<script type="text/babel">
  function App() {
    const vod = useVodMock();
    return (
      <DesignCanvas>
        <DCSection
          id="vod-studio"
          title="tradefarm · VOD studio"
          subtitle="The pipeline that turns a simulated trading day into a 10-min YouTube episode. Four operator surfaces — drag to reorder, click any artboard to focus."
        >
          <DCArtboard id="beats" label="Beat picker · the keystone" width={1600} height={1000}>
            <BeatPicker vod={vod} />
          </DCArtboard>
          <DCArtboard id="pipeline" label="Pipeline status · 10 subsystems" width={1600} height={1000}>
            <PipelineBoard vod={vod} />
          </DCArtboard>
          <DCArtboard id="session" label="Session control · let the simulation run" width={1600} height={1000}>
            <SessionControl vod={vod} />
          </DCArtboard>
          <DCArtboard id="episode" label="Episode review · ready to publish" width={1600} height={1000}>
            <EpisodePage vod={vod} />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
