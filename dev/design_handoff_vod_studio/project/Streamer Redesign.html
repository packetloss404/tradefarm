<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Streamer Redesign · tradefarm</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Yeseva+One&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #0b0b0e; color: #fafafa; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; height: 100%; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  @keyframes pulse-dot {
    0%,100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(0.5); opacity: 0.4; }
  }
  .pulse-dot { animation: pulse-dot 1.2s ease-in-out infinite; }

  @keyframes cursor-blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  .cursor-blink { animation: cursor-blink 1s step-end infinite; }

  @keyframes v1-marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .v1-marquee { animation: v1-marquee 60s linear infinite; }

  @keyframes v3-marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .v3-marquee { animation: v3-marquee 50s linear infinite; }

  @keyframes v3-bulb-0 { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  @keyframes v3-bulb-1 { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
  @keyframes v3-bulb-2 { 0%,100% { opacity: 0.7; } 50% { opacity: 0.4; } }
  .v3-bulb-0 { animation: v3-bulb-0 1.4s ease-in-out infinite; }
  .v3-bulb-1 { animation: v3-bulb-1 1.4s ease-in-out infinite; }
  .v3-bulb-2 { animation: v3-bulb-2 1.4s ease-in-out infinite; }

  @keyframes v2-flicker { 0%,100% { opacity: 1; } 49% { opacity: 1; } 50% { opacity: 0.96; } }
  .v2-crt { animation: v2-flicker 6s steps(2) infinite; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="mock-data.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="v1-broadcast.jsx"></script>
<script type="text/babel" src="v2-terminal.jsx"></script>
<script type="text/babel" src="v3-racetrack.jsx"></script>
<script type="text/babel" src="v4-twitch.jsx"></script>

<script type="text/babel">
  const { useState, useEffect } = React;

  function App() {
    const stream = useStreamMock();
    return (
      <DesignCanvas>
        <DCSection
          id="streamer-redesigns"
          title="tradefarm · streamer redesigns"
          subtitle="four 1920×1080 broadcast layouts, all running the same simulated 100-agent tick stream. drag-reorder, click any artboard to focus."
        >
          <DCArtboard id="v1-broadcast" label="V1 · Sports broadcast (ESPN-style)" width={1920} height={1080}>
            <BroadcastV1 stream={stream} />
          </DCArtboard>
          <DCArtboard id="v2-terminal" label="V2 · Cyberpunk Bloomberg terminal" width={1920} height={1080}>
            <BroadcastV2 stream={stream} />
          </DCArtboard>
          <DCArtboard id="v3-racetrack" label="V3 · Casino · racetrack" width={1920} height={1080}>
            <BroadcastV3 stream={stream} />
          </DCArtboard>
          <DCArtboard id="v4-twitch" label="V4 · Twitch overlay" width={1920} height={1080}>
            <BroadcastV4 stream={stream} />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
